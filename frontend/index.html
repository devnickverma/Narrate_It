<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Turn PDFs into Narrated Voiceover Videos in Seconds. Decode page-by-page text, execute Gemini narrations, and compile MoviePy timeline animations natively.">
    <title>NarrateIt — Turn PDFs into Narrated Videos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="auth-wrapper">
        <main class="auth-container glass" id="auth-root">
            
            <header class="brand-header">
                <div class="brand-icon">🎬</div>
                <h1 class="brand-title">NarrateIt</h1>
                <p class="brand-subtitle">Turn PDFs into Narrated Videos in Seconds</p>
            </header>

            <!-- Authentication Form Layout -->
            <form id="login-form" aria-label="Passwordless Authentication Form">
                
                <div class="input-group">
                    <label for="email-input" class="input-label">Email Address</label>
                    <input 
                        type="email" 
                        id="email-input" 
                        class="input-field" 
                        placeholder="you@example.com" 
                        required 
                        autocomplete="email"
                    >
                </div>

                <div class="input-group hidden" id="otp-section">
                    <label for="otp-input" class="input-label">Verification OTP Code</label>
                    <input 
                        type="text" 
                        id="otp-input" 
                        class="input-field" 
                        placeholder="Enter 6-digit Code" 
                        inputmode="numeric" 
                        pattern="[0-9]{6}" 
                        maxlength="6"
                        autocomplete="one-time-code"
                    >
                </div>

                <button type="submit" class="btn btn-primary" id="submit-btn">
                    Get Verification Link
                </button>

            </form>

            <div class="divider">or continue with</div>

            <!-- Third party social authentication -->
            <button class="btn btn-google" id="google-login-btn">
                <img src="https://www.gstatic.com/images/branding/product/1x/gsa_color_144dp.png" alt="Google Brand Logo">
                Sign in with Google
            </button>

            <!-- Active Error Card Collections -->
            <div class="error-card hidden" id="error-message" role="alert"></div>

        </main>
    </div>

    <!-- Scripts Bootstrapping -->
    <script type="module" src="js/config.js"></script>
    <script type="module" src="js/api.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
